[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = ["spec(id): binds a test to its requirement"]

[project]
name = "emerald-exchange"
version = "2.3.8"
description = "Emerald Exchange — Unified Finance MCP Server with fully abstracted exchange backends for equities, crypto, and derivatives trading. CONCEPT:EE-001"
readme = "README.md"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3"]
requires-python = ">=3.12,<3.15"
dependencies = [
    "scion-sdk[mcp]>=0.7.0,<0.8.0",
    "numpy>=2.5.4",
    # CONCEPT:PHASE2-RECONCILE — relaxed off the pandas 3.x floor to match
    # scion-sdk's ecosystem-compatible range (the two must
    # resolve to the same pandas major across the workspace lock).
    "pandas>=2.2,<3",
]

[[project.authors]]
name = "Repository Maintainers"
email = "maintainers@knuckles.team"

[project.optional-dependencies]
mcp = ["scion-sdk[mcp]>=0.7.0,<0.8.0"]
alpaca = ["alpaca-py>=0.44.0"]
binance = ["python-binance>=1.0.37"]
crypto = ["ccxt>=4.5.88"]
prediction_markets = ["httpx>=0.28.1", "kalshi-python>=2.1.4", "py-clob-client>=0.34.6", "websockets>=17.2"]
fundamentals = ["edgartools>=5.62.0"]
wallet_intel = ["polars>=2.0.0", "py-clob-client>=0.34.6"]
all = [
    "alpaca-py>=0.44.0",
    "ccxt>=4.5.88",
    "httpx>=0.28.1",
    "kalshi-python>=2.1.4",
    "py-clob-client>=0.34.6",
    "websockets>=17.2",
    "edgartools>=5.62.0",
    "polars>=2.0.0",
]
# Live-engine test run: the suite starts the engine server from this extra.
test = [
    "medulla[server]>=3.0.0",
    "pyoxigraph>=0.5.11",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
emerald-exchange-mcp = "emerald_exchange.mcp_server:mcp_server"
emerald-cockpit = "emerald_exchange.cockpit:main"
# Launches the bundled wallet runtime daemon from the same image
# (CONN-EMERALD-EXCHANGE-X402-R011.1); never started by the MCP server.
emerald-wallet-daemon = "emerald_exchange.payments.daemon:main"

# The one declared connector identity: the fleet name (SDK-CONNECTOR-CONTROL-R071).
# Content (skills, ontology, prompts) is found by convention under the package;
# the removed provider entry-point groups are no longer read by the SDK
# (SDK-QUALITY-RELEASE-R005.1).
[project.entry-points."scion_sdk.connector"]
emerald-exchange-mcp = "emerald_exchange:connector"

[tool.uv.workspace]
members = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B",]
ignore = [ "E402", "E501", "B008",]

[tool.setuptools.package-data]
emerald_exchange = [ "mcp_config.json", "prompts/**", "skills/**", "ontology/**", "connectors/**",]

[tool.setuptools.packages.find]
where = ["."]

[tool.uv]
override-dependencies = [
    "fastmcp-slim[client,server]>=4.1.0",
]

[tool.pipelines_hooks.ste]
exempt = ["specs/*", "specs/**/*"]

# CONN-EMERALD-EXCHANGE-X402-R012.1: the image bundles the wallet runtime at one
# pinned upstream release (MIT, linux-x64 runtime archive), verified by sha256 at
# build time. The archive carries no key or wallet; key material resolves at run
# time from secret references only (R011.1). Bump = new tag + new checksum.
[tool.pipelines.container]
entrypoints = { mcp = "emerald-exchange-mcp" }
runtime_apt = ["nodejs", "ca-certificates"]
extra_stages = [
    '''
FROM builder-base AS wallet-runtime
ADD --checksum=sha256:ceced13afd6e89fa5198b6a11293a7ea3191ec8facd9156f27a77909b3258e3c \
    https://github.com/worldliberty/agentpay-sdk/releases/download/v0.5.0/agentpay-sdk-linux-x64.tar.gz \
    /tmp/wallet-runtime.tar.gz
RUN mkdir -p /opt/wallet-runtime/bin \
    && tar -xzf /tmp/wallet-runtime.tar.gz -C /opt/wallet-runtime \
    && rm /tmp/wallet-runtime.tar.gz \
    && printf '#!/bin/sh\nexec node /opt/wallet-runtime/app/dist/cli.cjs "$@"\n' \
        > /opt/wallet-runtime/bin/wallet-runtime \
    && chmod 0755 /opt/wallet-runtime/bin/wallet-runtime \
    && test -x /opt/wallet-runtime/runtime/bin/agentpay-daemon
''',
]
stage_copies = [
    "COPY --from=wallet-runtime /opt/wallet-runtime /opt/wallet-runtime",
    "RUN ln -s /opt/wallet-runtime/bin/wallet-runtime /usr/local/bin/wallet-runtime",
]
