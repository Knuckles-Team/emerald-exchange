[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emerald-exchange"
version = "2.3.1"
description = "Emerald Exchange — Unified Finance MCP Server with fully abstracted exchange backends for equities, crypto, and derivatives trading. CONCEPT:EE-001"
readme = "README.md"
authors = [{ name = "Project Maintainers", email = "maintainers@users.noreply.github.com" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3"]
requires-python = ">=3.12,<3.15"
dependencies = [
    "agent-connector-sdk[mcp]>=0.3.0,<1.0.0",
    "numpy>=2.5.4",
    # CONCEPT:PHASE2-RECONCILE — relaxed off the pandas 3.x floor to match
    # agent-connector-sdk's ecosystem-compatible range (the two must
    # resolve to the same pandas major across the workspace lock).
    "pandas>=2.2,<3",
]

[project.optional-dependencies]
mcp = ["agent-connector-sdk[mcp]>=0.3.0,<1.0.0"]
alpaca = ["alpaca-py>=0.44.0"]
binance = ["python-binance>=1.0.37"]
crypto = ["ccxt>=4.5.88"]
prediction_markets = ["httpx>=0.28.1", "kalshi-python>=2.1.4", "py-clob-client>=0.34.6", "websockets>=17.2"]
fundamentals = ["edgartools>=5.62.0"]
wallet_intel = ["polars>=2.0.0", "py-clob-client>=0.34.6"]
all = [
    "alpaca-py>=0.44.0",
    "ccxt>=4.5.88",
    "httpx>=0.28.1",
    "kalshi-python>=2.1.4",
    "py-clob-client>=0.34.6",
    "websockets>=17.2",
    "edgartools>=5.62.0",
    "polars>=2.0.0",
]
# Live-engine test run: the suite starts epistemic-graph-server from this extra.
test = [
    "epistemic-graph[server]==2.27.3",
    "pyoxigraph>=0.5.11",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
emerald-exchange-mcp = "emerald_exchange.mcp_server:mcp_server"
emerald-cockpit = "emerald_exchange.cockpit:main"

[project.entry-points."agent_connector_sdk.skill_providers"]
emerald-exchange = "emerald_exchange.skills"

# CONCEPT:AU-KG.ingest.mcp-tool-connector — Tier-1 declarative source preset(s) that sync
# this package's records into the KG via its own MCP server, resolved via iter_provider_dirs.
[project.entry-points."agent_connector_sdk.source_connector_providers"]
emerald-exchange = "emerald_exchange.connectors"

# CONCEPT:AU-KG.ontology.package-federation-migration — federate this package's OWL/RDF ontology modules into the
# agent-connector-sdk ontology hub (quant, trading, banking). Resolved via iter_provider_dirs
# like the skill/prompt providers; the hub globs every *.ttl in the dir.
[project.entry-points."agent_connector_sdk.ontology_providers"]
emerald-exchange = "emerald_exchange.ontology"

[tool.uv.workspace]
members = ["."]

[tool.setuptools.package-data]
emerald_exchange = [ "mcp_config.json", "prompts/**", "skills/**", "ontology/**", "connectors/**",]

[tool.setuptools.packages.find]
where = ["."]

[tool.uv]
override-dependencies = [
    "fastmcp-slim[client,server]>=4.1.0",
]

[tool.pipelines_hooks.ste]
exempt = ["specs/*", "specs/**/*"]
